extends: baselines/configs/common_offline.yaml

baseline:
  name: dscnn_s_logmel
  family: ds_cnn
  variant: dscnn_s
  role: offline_quality
  upstream: ARM-software/ML-KWS-for-MCU

frontend:
  type: logmel

model:
  input_shape: [256, 32, 1]
  num_classes: 3
  stem_filters: 32
  depthwise_blocks: 4
  pointwise_filters: 64
  dropout_rate: 0.10
